<h1>Posts</h1>
<ul>
  @for (post of posts; track post.id) {
    <li>
      <a [routerLink]="['/posts', post.slug]">{{ post.title }}</a>
      <small> — {{ post.author }} | {{ post.publishedAt | date:'mediumDate' }}</small>
      <button
        type="button"
        class="like-button"
        [class.liked]="post.isLikedByCurrentUser"
        [disabled]="!isLoggedIn"
        [title]="isLoggedIn ? (post.isLikedByCurrentUser ? 'Beğeniyi geri al' : 'Beğen') : 'Beğenmek için giriş yapmalısınız'"
        (click)="toggleLike(post)">
        {{ post.isLikedByCurrentUser ? '♥' : '♡' }} {{ post.likeCount }}
      </button>
      <br>
      <em>{{ post.tags }}</em>
    </li>
  }
</ul>

<div>
  <button (click)="goToPage(page - 1)" [disabled]="page <= 1">Önceki</button>
  <span> Sayfa {{ page }} / {{ totalPages }} </span>
  <button (click)="goToPage(page + 1)" [disabled]="page >= totalPages">Sonraki</button>
</div>
