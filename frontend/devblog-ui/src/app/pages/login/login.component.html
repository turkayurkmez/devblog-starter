<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-4">
    <div class="card mt-5">
      <div class="card-body">
        <h1 class="card-title h3 mb-3">Login</h1>
        @if (error) {
          <div class="alert alert-danger" role="alert">{{ error }}</div>
        }
        <form (ngSubmit)="login()">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input id="username" type="text" class="form-control" [(ngModel)]="username" name="username" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input id="password" type="password" class="form-control" [(ngModel)]="password" name="password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
      </div>
    </div>
  </div>
</div>
